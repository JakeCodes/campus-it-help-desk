<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>

    <title>Campus IT System - New Request</title>
    <meta name="description" content="Students submit a new IT support request.">

    <!-- Link to your external CSS stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
</head>
<body>

    <header class="has-actions">
        <h1>Campus IT Help Desk</h1>
        <button class="btn btn-header" onclick="logout()">Log out</button>
    </header>

    <main>
        <div class="card request-card">
            <h2>New IT Request</h2>
            <p class="subtitle">Tell us what's wrong and IT Support Staff will get back to you.</p>

            <form id="requestForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g. Can't connect to campus Wi-Fi" required>
                    <div id="kb-suggestions" class="kb-suggestions" style="display:none">
                        <div class="kb-title">Suggested help articles — might solve your issue:</div>
                        <div id="kb-results"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Choose one...</option>
                        <option value="Wi-Fi / Network">Wi-Fi / Network</option>
                        <option value="Account / Password">Account / Password</option>
                        <option value="Email">Email</option>
                        <option value="Printer">Printer</option>
                        <option value="Software">Software</option>
                        <option value="Hardware">Hardware</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="What happened? Where are you? Any error messages?" required></textarea>
                </div>

                <div class="form-group">
                    <label for="attachment">Screenshot / Attachment <span style="font-weight:normal;color:#888">(optional, max 5 MB)</span></label>
                    <input type="file" id="attachment" accept="image/*,.pdf">
                </div>

                <p id="errorMessage" class="error-message"></p>
                <p id="successMessage" class="success-message"></p>

                <button type="submit" id="submitButton" class="btn btn-primary">Submit Request</button>
            </form>

            <div class="form-links">
                <p><a href="student.html">Back to my requests</a></p>
            </div>
        </div>
    </main>

    <script src="new-request.js"></script>
    <script src="session.js"></script>
</body>
</html>
