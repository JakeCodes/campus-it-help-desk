<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Campus IT System - Admin</title>
    <meta name="description" content="IT Support Staff view of all requests and users.">

    <!-- Link to your external CSS stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
</head>
<body>

    <header class="has-actions">
        <h1>Campus IT Help Desk</h1>
        <button class="btn btn-header" onclick="logout()">Log out</button>
    </header>

    <main>
        <div class="card">
            <h2>All IT Requests</h2>
            <p class="subtitle">Every request submitted by students.</p>
        </div>

        <div id="request-list">
            <p>Loading Tickets...</p>
        </div>

        <div class="card request-card section-gap">
            <h2>Users</h2>
            <ul id="user-list" class="user-list"></ul>

            <h3>Add a User</h3>
            <form id="userForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="text" id="password" required>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role">
                        <option value="student">Student</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <p id="errorMessage" class="error-message"></p>
                <p id="successMessage" class="success-message"></p>

                <button type="submit" class="btn btn-primary">Add User</button>
            </form>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
